<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Авто Фортуна — оплата</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap client">
<section class="card center">
<div class="brand">● АВТО ФОРТУНА</div>
<div class="icon">₴</div>
<p class="muted">Сума до оплати</p>
<div id="amount" class="big">—</div>
<p id="purpose" class="muted"></p>

<div class="payment-info">
<div><span>Отримувач</span><b id="recipient">—</b></div>
<div><span>IBAN</span><b id="ibanDisplay">—</b></div>
</div>

<form id="paymentForm" action="https://iban.opendatabot.ua/api/invoice" method="post">
<input name="code" id="paymentCode" type="hidden">
<input name="iban" id="paymentIban" type="hidden">
<input name="amount" id="paymentAmount" type="hidden">
<input name="purpose" id="paymentPurpose" type="hidden">
<input name="responseMode" type="hidden" value="page">
<input name="x-client-key" type="hidden" value="BCJvJtx/9OOtsqvPrW8ay9z2yEezLZrIZf6S+rdB6eQ=">
<input name="x-client-name" type="hidden" value="public">
<button id="pay" class="primary" type="submit">ВИБРАТИ БАНК І ОПЛАТИТИ</button>
</form>

<p id="error" class="error" aria-live="polite"></p>
<p class="small">Після натискання відкриється сторінка оплати з доступними банками.</p>
</section>
</main>
<script src="pay.js"></script>
</body>
</html>
