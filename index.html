<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Авто Фортуна — створення оплати</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><section class="card"><div class="brand">● АВТО ФОРТУНА</div><h1>Створити оплату</h1><p class="muted">Введи суму та отримай готове посилання для клієнта.</p><label>Сума, грн</label><div class="amount-box"><input id="amount" inputmode="decimal" placeholder="0.00"><span>₴</span></div><label>Призначення</label><input id="purpose" class="text" value="Оплата за ремонт автомобіля"><button id="create" class="primary">Створити посилання</button><div id="result" class="result hidden"><b>Посилання для клієнта</b><input id="link" class="text" readonly><div class="actions"><button id="copy" class="secondary">Скопіювати</button><button id="open" class="secondary">Відкрити</button></div><div id="status"></div></div></section></main><script src="app.js"></script></body></html>
